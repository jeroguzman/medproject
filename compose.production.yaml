name: vozclinica-production

x-backend: &backend
  image: vozclinica-backend:${APP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-vozclinica}:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vozclinica}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configura DJANGO_SECRET_KEY}
    DEBUG: "false"
    ALLOWED_HOSTS: ${API_DOMAIN:?Configura API_DOMAIN},localhost,127.0.0.1
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Configura CORS_ALLOWED_ORIGINS}
    DJANGO_TRUST_PROXY_HEADERS: "true"
    AUTH_PROVIDER: ${AUTH_PROVIDER:-mojoauth}
    MOJOAUTH_API_KEY: ${MOJOAUTH_API_KEY:-}
    MOJOAUTH_API_SECRET: ${MOJOAUTH_API_SECRET:-}
    IA_ORQUESTADOR: ${IA_ORQUESTADOR:-n8n}
    N8N_BASE_URL: ${N8N_BASE_URL:-}
    N8N_SECRET: ${N8N_SECRET:-}
    ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    BACKBOARD_API_KEY: ${BACKBOARD_API_KEY:-}
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks:
    - edge
    - data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vozclinica}
      POSTGRES_USER: ${POSTGRES_USER:-vozclinica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  prepare:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/backend/staticfiles

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/backend/staticfiles:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host':'localhost'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  demo:
    <<: *backend
    profiles: ["demo"]
    environment:
      <<: *backend-env
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Configura DEMO_PASSWORD}
    command: ["python", "manage.py", "cargar_demo"]
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: vozclinica-frontend:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_USAR_MOCKS: ${FRONTEND_MOCKS:-false}
        VITE_AUTH_PROVIDER: ${AUTH_PROVIDER:-mojoauth}
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Configura API_DOMAIN}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  static_data:
  caddy_data:
  caddy_config:
